
spring.application.name=config-server

server.port=8888

# Trỏ đường dẫn tới thư mục Git local đã tạo ở Bước 1
# Lưu ý: Đường dẫn phải có tiền tố file:/// và dùng dấu / (forward slash)
spring.cloud.config.server.git.uri=file:///C:/medical-config-repo

# Nhánh Git của bạn (main hoặc master)
spring.cloud.config.server.git.default-label=main